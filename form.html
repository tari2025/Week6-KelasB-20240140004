<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big Shop | Buat Caption</title>
    <link rel="stylesheet" href="./css/form.css" />
    <script src="./js/form.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a href="./index.html" class="brand">Big Shop<span>.</span></a>
      <nav>
        <a href="./index.html">Etalase</a>
        <a href="./form.html" class="active">Caption</a>
      </nav>
    </header>

    <main class="container">
      <section class="page-heading">
        <p class="eyebrow">CAPTION GENERATOR</p>
        <h1>Buat Caption<span>.</span></h1>
        <p class="description">
          Buat caption promosi produk dengan mudah, pilih template yang sesuai
          dengan gaya tokomu.
        </p>
      </section>

      <section class="caption-card">
        <form id="form" novalidate>
          <div class="field">
            <label for="nama">Nama Produk</label>
            <input
              type="text"
              id="nama"
              name="nama"
              placeholder="Contoh: Kopi Susu Aren"
              minlength="3"
              maxlength="60"
              autocomplete="off"
              aria-describedby="nama-error"
              required
            />
            <small class="error-message" id="nama-error"></small>
          </div>

          <div class="field">
            <label for="harga">Harga Produk (Rupiah)</label>
            <input
              type="number"
              id="harga"
              name="harga"
              placeholder="Contoh: 25000"
              min="1000"
              max="100000000"
              step="1"
              aria-describedby="harga-error"
              required
            />
            <small class="error-message" id="harga-error"></small>
          </div>

          <div class="field">
            <label for="template">Pilih Template Caption</label>
            <select id="template" name="template">
              <option value="promo">Promo Spesial</option>
              <option value="santai">Santai dan Kekinian</option>
              <option value="formal">Formal dan Profesional</option>
            </select>
          </div>

          <button type="submit" class="primary-button">Buat Caption</button>

          <div class="result-section">
            <label for="caption">Hasil Caption</label>
            <textarea
              id="caption"
              name="caption"
              rows="13"
              placeholder="Caption akan muncul di sini setelah kamu menekan tombol Buat Caption."
              readonly
            ></textarea>

            <button type="button" id="copyButton" class="secondary-button">
              Salin Caption
            </button>
          </div>

          <p id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer>Praktikum PAW WEEK 6 — FETCH API &amp; DOM</footer>
  </body>
</html>
