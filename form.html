<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big Shop | Buat Caption</title>
    <link rel="stylesheet" href="./css/form.css" />
    <script src="./js/form.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a href="./index.html" class="brand">Big Shop<span>.</span></a>
      <nav>
        <a href="./index.html">Etalase</a>
        <a href="./form.html" class="active">Caption</a>
      </nav>
    </header>

    <main class="container">
      <!-- Judul Halaman -->
      <div class="page-heading">
        <p class="eyebrow">BIG SHOP</p>
        <h1>Buat Caption<span>.</span></h1>
        <p class="description">
          Isi data di bawah untuk membuat caption promosi.
        </p>
      </div>

      <!-- Kotak Putih (Card) -->
      <div class="caption-card">
        <!-- Pesan Error / Sukses -->
        <p id="formStatus"></p>

        <form id="captionForm">
          <!-- Ganti form-group jadi field -->
          <div class="field">
            <label for="productName">Nama Produk</label>
            <input
              type="text"
              id="productName"
              placeholder="Contoh: Sepatu Sneakers"
              required
            />
          </div>

          <div class="field">
            <label for="productPrice">Harga (Rp)</label>
            <input
              type="number"
              id="productPrice"
              placeholder="Contoh: 250000"
              required
            />
          </div>

          <div class="field">
            <label for="templateSelect">Pilih Template</label>
            <select id="templateSelect">
              <option value="santai">Santai / Gaul</option>
              <option value="promo">Promo Spesial</option>
              <option value="formal">Formal / Elegan</option>
            </select>
          </div>

          <!-- Ganti btn-primary jadi primary-button -->
          <button type="submit" class="primary-button">Buat Caption</button>
        </form>

        <div class="result-group">
          <div class="field">
            <label for="captionResult">Hasil Caption</label>
            <textarea
              id="captionResult"
              rows="8"
              placeholder="Caption akan muncul di sini..."
            ></textarea>
          </div>
          <!-- Ganti btn-secondary jadi secondary-button -->
          <button type="button" id="copyButton" class="secondary-button">
            Salin Caption
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
